
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Explore ATHAR coding and technology workshops, search available sessions, and find your next learning opportunity."
    >

    <meta name="theme-color" content="#6F8FD6">

    <title>All Workshops | ATHAR</title>

    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/workshops.css">

    <script src="assets/js/shared-layout.js" defer></script>
    <script src="assets/js/auth.js" defer></script>
    <script src="assets/js/workshops.js" defer></script>
</head>

<body>

    <!-- Shared Header -->
    <div id="sharedHeader"></div>

    <main>
        <!-- Workshops Hero -->
        <section class="workshops-hero">
            <div class="container">
                <p class="eyebrow">LEARN SOMETHING NEW</p>

                <h1>Explore all workshops</h1>

                <p>
                    Discover coding workshops, build practical skills,
                    and take the next step in your learning journey.
                </p>
            </div>
        </section>

        <!-- Workshops Listing -->
        <section class="all-workshops-section container">

            <div class="workshops-toolbar">
                <div class="search-wrapper">
                    <label for="workshopSearch">
                        Search workshops
                    </label>

                    <input
                        type="search"
                        id="workshopSearch"
                        placeholder="Search by title or description..."
                    >
                </div>

                <div class="filter-wrapper">
                    <label for="workshopType">
                        Workshop format
                    </label>

                    <select id="workshopType">
                        <option value="all">All formats</option>
                        <option value="onsite">On-site</option>
                        <option value="online">Online</option>
                    </select>
                </div>
            </div>

            <div class="results-heading">
                <h2>Available workshops</h2>
                <p id="workshopCount" aria-live="polite"></p>
            </div>

            <div
                id="allWorkshops"
                class="workshops-grid"
                aria-live="polite"
            >
                <p class="workshop-message">
                    Loading workshops...
                </p>
            </div>

        </section>
    </main>

    <!-- Shared Footer -->
    <div id="sharedFooter"></div>

</body>
</html>
