<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Workshops | ATHAR</title>

    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/workshops.css">

    <script src="assets/js/workshops.js" defer></script>
</head>
<body>
    <header class="site-header">
    <nav class="navbar container" aria-label="Main navigation">

       <a class="brand" href="index.html" aria-label="ATHAR home">
                <img src="/athar/frontend/assets/images/athar_logo-removebg-preview.png" alt="logo" width="150px " height="50px">
            </a>

        <button
            id="menuToggle"
            class="menu-toggle"
            type="button"
            aria-label="Toggle navigation"
            aria-expanded="false"
            aria-controls="navLinks"
        >☰</button>

        <div class="nav-links" id="navLinks">
            <a href="workshops.html" aria-current="page">Workshops</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>

        <div class="nav-actions" id="authActions">
            <a class="login-link" href="login.html">Log in</a>
            <a class="btn btn-primary" href="register.html">Join ATHAR</a>
        </div>

    </nav>
</header>

    <main>
        <section class="workshops-hero">
            <div class="container">
                <p class="eyebrow">LEARN SOMETHING NEW</p>
                <h1>Explore all workshops</h1>
                <p>
                    Discover coding workshops, build practical skills,
                    and take the next step in your learning journey.
                </p>
            </div>
        </section>

        <section class="all-workshops-section container">
            <div class="workshops-toolbar">
                <div class="search-wrapper">
                    <label for="workshopSearch">Search workshops</label>
                    <input
                        type="search"
                        id="workshopSearch"
                        placeholder="Search by title or description..."
                    >
                </div>

                <div class="filter-wrapper">
                    <label for="workshopType">Workshop format</label>
                    <select id="workshopType">
                        <option value="all">All formats</option>
                        <option value="onsite">On-site</option>
                        <option value="online">Online</option>
                    </select>
                </div>
            </div>

            <div class="results-heading">
                <h2>Available workshops</h2>
                <p id="workshopCount" aria-live="polite"></p>
            </div>

            <div
                id="allWorkshops"
                class="workshops-grid"
                aria-live="polite"
            >
                <p class="workshop-message">Loading workshops...</p>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-content">
            <a class="logo" href="index.html">ATHAR</a>
            <p>Learn. Practice. Grow.</p>
            <p>© <span id="currentYear"></span> ATHAR. All rights reserved.</p>
        </div>
    </footer>
    <script src="assets/js/auth.js"></script>
</body>
</html>
