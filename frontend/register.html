 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your ATHAR account and join our workshops.">
    <title>Create Account | ATHAR</title>

    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <script src="assets/js/auth.js" defer></script>
</head>
<body>

    <header class="site-header">
        <nav class="navbar container">
            <a href="workshops.html" class="logo">ATHAR</a>

            <button
                class="menu-toggle"
                id="menuToggle"
                type="button"
                aria-label="Toggle navigation"
                aria-expanded="false"
            >
                ☰
            </button>

            <div class="nav-links" id="navLinks">
                <a href="index.html">Home</a>
                <a href="workshops.html">Workshops</a>
                <a href="login.html">Login</a>
                <a href="register.html" class="nav-cta" aria-current="page">
                    Join Us
                </a>
            </div>
        </nav>
    </header>

    <main class="auth-page">
        <section class="auth-card" aria-labelledby="registerTitle">

            <div class="auth-heading">
                <span class="auth-eyebrow">WELCOME TO ATHAR</span>
                <h1 id="registerTitle">Create Your Account</h1>
                <p>Join our community and start exploring new workshops.</p>
            </div>

            <div
                id="formMessage"
                class="form-message"
                role="status"
                aria-live="polite"
                hidden
            ></div>

            <form id="registerForm" novalidate>

                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input
                            type="text"
                            id="firstName"
                            name="first_name"
                            placeholder="Enter your first name"
                            autocomplete="given-name"
                            maxlength="100"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input
                            type="text"
                            id="lastName"
                            name="last_name"
                            placeholder="Enter your last name"
                            autocomplete="family-name"
                            maxlength="100"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        maxlength="255"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        autocomplete="tel"
                        maxlength="20"
                        required
                    >
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="At least 8 characters"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirm_password"
                            placeholder="Repeat your password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <select id="gender" name="gender" required>
                            <option value="">Select gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="birthDate">Birth Date <span class="optional">(Optional)</span></label>
                        <input
                            type="date"
                            id="birthDate"
                            name="birth_date"
                            autocomplete="bday"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="location">Location <span class="optional">(Optional)</span></label>
                    <input
                        type="text"
                        id="location"
                        name="location"
                        placeholder="City, Country"
                        autocomplete="address-level2"
                        maxlength="255"
                    >
                </div>

                <button type="submit" class="auth-submit" id="submitButton">
                    Create Account
                </button>

                <p class="auth-switch">
                    Already have an account?
                    <a href="login.html">Log in</a>
                </p>

            </form>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-content">
            <a href="index.html" class="logo">ATHAR</a>
            <p>&copy; <span id="currentYear"></span> ATHAR. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
