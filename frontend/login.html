 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in to your ATHAR account and explore workshops.">
    <title>Login | ATHAR</title>

    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <script src="assets/js/auth.js" defer></script>
</head>
<body>

    <header class="site-header">
        <nav class="navbar container">
            <a href="index.html" class="logo">ATHAR</a>

            <button
                class="menu-toggle"
                id="menuToggle"
                type="button"
                aria-label="Toggle navigation"
                aria-expanded="false"
            >
                ☰
            </button>

            <div class="nav-links" id="navLinks">
                <a href="index.html">Home</a>
                <a href="workshops.html">Workshops</a>
                <a href="login.html" aria-current="page">Login</a>
                <a href="register.html" class="nav-cta">Join Us</a>
            </div>
        </nav>
    </header>

    <main class="auth-page login-page">
        <section class="auth-card login-card" aria-labelledby="loginTitle">

            <div class="auth-heading">
                <span class="auth-eyebrow">WELCOME BACK TO ATHAR</span>
                <h1 id="loginTitle">Welcome Back</h1>
                <p>Log in to continue your learning journey with us.</p>
            </div>

            <div
                id="loginMessage"
                class="form-message"
                role="status"
                aria-live="polite"
                hidden
            ></div>

            <form id="loginForm" novalidate>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        maxlength="255"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="auth-submit" id="loginButton">
                    Log In
                </button>

                <p class="auth-switch">
                    Don't have an account?
                    <a href="register.html">Create an account</a>
                </p>

            </form>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-content">
            <a href="index.html" class="logo">ATHAR</a>
            <p>&copy; <span id="currentYear"></span> ATHAR. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
