<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Log in to your ATHAR account and continue your learning journey."
    >

    <meta name="theme-color" content="#6F8FD6">

    <title>Login | ATHAR</title>

    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/auth.css">

    <script src="assets/js/shared-layout.js" defer></script>
    <script src="assets/js/auth.js" defer></script>
</head>

<body>

    <!-- Shared Header -->
    <div id="sharedHeader"></div>

    <main class="auth-page login-page">
        <section
            class="auth-card login-card"
            aria-labelledby="loginTitle"
        >

            <div class="auth-heading">
                <span class="auth-eyebrow">
                    WELCOME BACK TO ATHAR
                </span>

                <h1 id="loginTitle">Welcome Back</h1>

                <p>
                    Log in to continue your learning journey with us.
                </p>
            </div>

            <div
                id="loginMessage"
                class="form-message"
                role="status"
                aria-live="polite"
                hidden
            ></div>

            <form id="loginForm" novalidate>

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        maxlength="255"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="auth-submit"
                    id="loginButton"
                >
                    Log In
                </button>

                <p class="auth-switch">
                    Don't have an account?
                    <a href="register.html">Create an account</a>
                </p>

            </form>
        </section>
    </main>

    <!-- Shared Footer -->
    <div id="sharedFooter"></div>

</body>
</html>
